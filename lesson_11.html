<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Math Tutoring - Number Puzzles & Missing Digits</title>
    <!-- KaTeX CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root {
            --primary: #58cc02; --primary-dark: #46a302; --wrong: #ff4b4b; --wrong-dark: #ea2b2b;
            --bg: #131f24; --sidebar-bg: #1a2e35; --card-bg: #ffffff; --text-main: #3c3c3c;
            --text-light: #8b8b8b; --border: #e5e5e5;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Nunito', sans-serif; }
        body { display: flex; height: 100vh; background: var(--bg); color: var(--text-main); overflow: hidden; }
        
        /* Sidebar */
        #sidebar { width: 280px; background: var(--sidebar-bg); color: white; display: flex; flex-direction: column; overflow-y: auto; flex-shrink: 0; }
        .sidebar-header { padding: 20px; background: rgba(0,0,0,0.2); text-align: center; }
        .sidebar-header h2 { font-size: 1.2rem; color: var(--primary); margin-bottom: 5px; }
        .nav-list { list-style: none; padding: 10px 0; flex: 1; }
        .nav-item { padding: 12px 20px; cursor: pointer; display: flex; align-items: center; transition: 0.2s; border-left: 4px solid transparent; font-size: 0.9rem; }
        .nav-item:hover { background: rgba(255,255,255,0.1); }
        .nav-item.active { background: rgba(255,255,255,0.1); border-left-color: var(--primary); font-weight: bold; }
        .nav-item.completed { color: var(--primary); }
        .nav-item i { margin-right: 10px; width: 20px; text-align: center; }
        .reset-btn { margin: 20px; padding: 10px; background: var(--wrong); color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; }

        /* Main Content */
        #main { flex: 1; display: flex; flex-direction: column; overflow: hidden; background: #f7f7f7; }
        .top-bar { background: white; padding: 15px 30px; border-bottom: 2px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
        .progress-bar-bg { flex: 1; height: 12px; background: var(--border); border-radius: 10px; margin: 0 20px; overflow: hidden; }
        .progress-bar-fill { height: 100%; background: var(--primary); width: 0%; transition: width 0.3s; border-radius: 10px; }
        
        .content-area { flex: 1; overflow-y: auto; padding: 30px; display: flex; justify-content: center; }
        .card { background: var(--card-bg); border-radius: 16px; border: 2px solid var(--border); padding: 30px; max-width: 700px; width: 100%; box-shadow: 0 4px 15px rgba(0,0,0,0.05); animation: fadeIn 0.3s; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } }
        @keyframes pop { 0% { transform: scale(1); } 50% { transform: scale(1.05); } 100% { transform: scale(1); } }

        /* Translations & Math */
        .id-lang { display: block; font-size: 0.8rem; color: var(--text-light); margin-top: 4px; font-style: italic; }
        .math-block { margin: 15px 0; font-size: 1.2rem; text-align: center; }
        .theory-box { background: #e8f5e9; padding: 15px; border-radius: 10px; border-left: 4px solid var(--primary); margin-bottom: 20px; }
        .svg-icon { width: 80px; height: 80px; margin: 0 auto 20px; display: block; }

        /* Exercises */
        .exercise-question { font-size: 1.1rem; font-weight: bold; margin-bottom: 15px; }
        .options-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 15px; }
        .opt-btn { padding: 12px; border: 2px solid var(--border); border-radius: 12px; background: white; cursor: pointer; transition: 0.2s; font-size: 1rem; text-align: center; }
        .opt-btn:hover { border-color: var(--primary-dark); background: #f0ffe0; }
        .opt-btn.correct { border-color: var(--primary); background: #d4ffb0; animation: pop 0.3s; }
        .opt-btn.wrong { border-color: var(--wrong); background: #ffd4d4; animation: shake 0.3s; }
        .opt-btn.disabled { pointer-events: none; opacity: 0.7; }
        .input-answer { width: 100%; padding: 12px; border: 2px solid var(--border); border-radius: 12px; font-size: 1.1rem; text-align: center; outline: none; }
        .input-answer:focus { border-color: var(--primary); }

        /* Feedback Collapse */
        .feedback-collapse { max-height: 0; overflow: hidden; transition: max-height 0.3s ease-out; background: #fff9c4; border-radius: 8px; margin-top: 10px; }
        .feedback-collapse.show { max-height: 200px; padding: 15px; border-left: 4px solid #fbc02d; }

        /* Bottom Navigation */
        .bottom-nav { background: white; padding: 15px 30px; border-top: 2px solid var(--border); display: flex; justify-content: space-between; }
        .nav-btn { padding: 12px 24px; border: none; border-radius: 12px; font-weight: bold; cursor: pointer; transition: 0.2s; border-bottom: 4px solid rgba(0,0,0,0.1); }
        .nav-btn:active { transform: translateY(2px); border-bottom-width: 2px; }
        .btn-prev { background: #e5e5e5; color: var(--text-main); }
        .btn-reset-ex { background: #ff9600; color: white; } /* Warna oranye agar beda dari prev/next */
		.btn-print { background: #8b57c0; color: white; }
        .btn-next { background: var(--primary); color: white; }
        .btn-check { background: #1cb0f6; color: white; }

        /* Print CSS for Assignment */
        @media print {
            body { background: white; }
            #sidebar, .top-bar, .bottom-nav, .opt-btn, .input-answer, .btn-check, .reset-btn { display: none !important; }
            #main { width: 100%; }
            .content-area { padding: 0; }
            .card { box-shadow: none; border: none; padding: 0; }
            .print-area { display: block; width: 100%; font-size: 11px; }
            .print-area h2 { font-size: 16px; }
            .print-table { width: 100%; border-collapse: collapse; margin-top: 10px; }
            .print-table th, .print-table td { border: 1px solid black; padding: 4px; text-align: left; font-size: 11px; }
        }
        .print-area { display: none; }
    </style>
</head>
<body>

    <!-- Sidebar -->
    <div id="sidebar">
        <div class="sidebar-header">
            <h2><i class="fas fa-user-secret"></i> MATH TUTORING</h2>
            <div style="font-size:0.8rem">by Deni</div>
        </div>
        <ul class="nav-list" id="navList">
            <!-- Populated by JS -->
        </ul>
        <button class="reset-btn" onclick="resetAll()"><i class="fas fa-redo"></i> Reset All Progress</button>
    </div>

    <!-- Main Content -->
    <div id="main">
        <div class="top-bar">
            <div style="font-weight:bold"; color: var(--text-main)"><i class="fas fa-book-open"></i> Number Puzzles</div>
            <div class="progress-bar-bg"><div class="progress-bar-fill" id="progressFill"></div></div>
            <div id="progressText" style="font-weight:bold; color:var(--primary)">0%</div>
        </div>
        
        <div class="content-area">
            <div class="card" id="contentCard">
                <!-- Rendered by JS -->
            </div>
        </div>

        <div class="bottom-nav">
            <button class="nav-btn btn-prev" onclick="nav(-1)"><i class="fas fa-arrow-left"></i> Previous</button>
            <button class="nav-btn btn-reset-ex" onclick="resetCurrentExercise()"><i class="fas fa-undo"></i> Reset</button>
            <button class="nav-btn btn-print" id="printBtn" onclick="printAssignment(currentSection)"><i class="fas fa-print"></i> PRINT</button>
            <button class="nav-btn btn-check" id="checkBtn" onclick="checkAnswer()">CHECK</button>
            <button class="nav-btn btn-next" onclick="nav(1)">NEXT <i class="fas fa-arrow-right"></i></button>
        </div>
    </div>

    <!-- KaTeX JS -->
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>

    <script>
        // --- CORE DATA STRUCTURE (Will be populated across chats) ---
        const SECTIONS = [];
        let currentSection = 0;
        let currentItem = 0;
        let userProgress = {};

        // --- UI & NAVIGATION ---
        function init() {
            buildNav();
            loadProgress();
            renderView();
        }

        function buildNav() {
            const navList = document.getElementById('navList');
            navList.innerHTML = '';
            SECTIONS.forEach((sec, i) => {
                let icon = sec.type === 'assignment' ? 'fa-clipboard-list' : 'fa-book';
                if(sec.type === 'home') icon = 'fa-home';
                if(sec.type === 'consolidation') icon = 'fa-flag-checkered';
                
                const li = document.createElement('li');
                li.className = 'nav-item';
                li.innerHTML = `<i class="fas ${icon}"></i> ${sec.title}`;
                li.onclick = () => { currentSection = i; currentItem = 0; renderView(); };
                navList.appendChild(li);
            });
        }

        function renderView() {
            const sec = SECTIONS[currentSection];
            const item = sec.items[currentItem];
            const card = document.getElementById('contentCard');
            
            // Update Nav Active State
            document.querySelectorAll('.nav-item').forEach((el, i) => {
                el.classList.toggle('active', i === currentSection);
            });

            // Render Content & Button Logic
            const isAssignment = sec.type === 'assignment';

            if(item.type === 'theory') {
                card.innerHTML = `<div class="theory-box">${item.content}</div>`;
                document.getElementById('checkBtn').style.display = 'none';
            } else {
                card.innerHTML = renderExercise(item);
                document.getElementById('checkBtn').style.display = 'inline-block';
            }
            
            // Tampilkan tombol PRINT hanya jika di dalam Assignment
            document.getElementById('printBtn').style.display = isAssignment ? 'inline-block' : 'none';
            
            renderMathInElement(card, {delimiters: [{left: '$$', right: '$$', display: true},{left: '$', right: '$', display: false}]});
            updateProgress();
        }

        function renderExercise(ex) {
            let html = `<div class="exercise-question">${ex.question}</div>`;
            if(ex.type === 'mc') {
                const shuffled = ex.options.sort(() => 0.5 - Math.random());
                html += `<div class="options-grid">`;
                shuffled.forEach((opt, i) => {
                    // Gunakan data-attribute untuk menghindari error simbol di onclick
                    html += `<button class="opt-btn" data-val="${opt}" onclick="selectOpt(this)">${opt}</button>`;
                });
                html += `</div>`;
            } else if(ex.type === 'input') {
                html += `<input type="text" class="input-answer" id="ansInput" placeholder="Type your answer...">`;
            }
            html += `<div class="feedback-collapse" id="feedback">${ex.feedback}</div>`;
            return html;
        }

        function selectOpt(btn) {
            document.querySelectorAll('.opt-btn').forEach(b => b.classList.add('disabled'));
            btn.classList.add('selected');
            btn.style.background = '#e8e8e8';
            window.selectedVal = btn.getAttribute('data-val'); // Ambil value dari data-val
        }

        function checkAnswer() {
            const sec = SECTIONS[currentSection];
            const item = sec.items[currentItem];
            let isCorrect = false;
            let val = '';

            if(item.type === 'mc') {
                val = window.selectedVal || '';
                isCorrect = val === item.answer;
                document.querySelectorAll('.opt-btn').forEach(btn => {
                    if(btn.getAttribute('data-val') === item.answer) btn.classList.add('correct');
                    if(btn.getAttribute('data-val') === val && !isCorrect) btn.classList.add('wrong');
                });
            } else if(item.type === 'input') {
                val = document.getElementById('ansInput').value.trim();
                isCorrect = val === item.answer;
                const inp = document.getElementById('ansInput');
                inp.style.borderColor = isCorrect ? 'var(--primary)' : 'var(--wrong)';
            }

            document.getElementById('feedback').classList.add('show');
            const pKey = `${currentSection}-${currentItem}`;
            // Simpan object berisi status dan jawaban siswa untuk fitur Print
            userProgress[pKey] = { correct: isCorrect, given: val };
            saveProgress();
        }

        function resetCurrentExercise() {
            const sec = SECTIONS[currentSection];
            const item = sec.items[currentItem];

            // 1. Reset Multiple Choice buttons
            if (item.type === 'mc') {
                document.querySelectorAll('.opt-btn').forEach(btn => {
                    btn.classList.remove('disabled', 'correct', 'wrong', 'selected');
                    btn.style.background = 'white'; // Kembalikan warna tombol
                });
                window.selectedVal = null;
            } 
            // 2. Reset Input field
            else if (item.type === 'input') {
                const inp = document.getElementById('ansInput');
                if(inp) {
                    inp.value = '';
                    inp.style.borderColor = 'var(--border)'; // Kembalikan border ke semula
                }
            }

            // 3. Sembunyikan Feedback / Penjelasan
            const feedback = document.getElementById('feedback');
            if(feedback) {
                feedback.classList.remove('show');
            }

            // 4. Hapus status jawaban dari Progress (agar bisa di-check ulang)
            const pKey = `${currentSection}-${currentItem}`;
            delete userProgress[pKey];
            saveProgress();
            updateProgress(); // Update progress bar di atas

            // 5. Pastikan tombol CHECK muncul kembali
            document.getElementById('checkBtn').style.display = 'inline-block';
        }

        function nav(dir) {
            const sec = SECTIONS[currentSection];
            currentItem += dir;
            if(currentItem >= sec.items.length) {
                if(currentSection < SECTIONS.length - 1) { currentSection++; currentItem = 0; }
                else { currentItem = sec.items.length - 1; }
            } else if(currentItem < 0) {
                if(currentSection > 0) { currentSection--; currentItem = SECTIONS[currentSection].items.length - 1; }
                else { currentItem = 0; }
            }
            window.selectedVal = null;
            renderView();
        }

        function updateProgress() {
            const total = SECTIONS.reduce((a, b) => a + b.items.length, 0);
            const done = Object.keys(userProgress).length;
            const pct = Math.round((done / total) * 100);
            document.getElementById('progressFill').style.width = pct + '%';
            document.getElementById('progressText').innerText = pct + '%';
        }

        function saveProgress() { localStorage.setItem('mathTutProg', JSON.stringify(userProgress)); }
        function loadProgress() { userProgress = JSON.parse(localStorage.getItem('mathTutProg')) || {}; }
        function resetAll() { localStorage.removeItem('mathTutProg'); userProgress = {}; updateProgress(); renderView(); alert('Progress Reset!'); }

        // --- SECTION INJECTION (PART 1) ---
        
        // HOME SECTION
        SECTIONS.push({
            title: "Home",
            type: "home",
            items: [
                { type: "theory", content: `
                    <svg class="svg-icon" viewBox="0 0 100 100"><circle cx="50" cy="50" r="40" fill="#58cc02"/><text x="50" y="55" text-anchor="middle" fill="white" font-size="30">?</text></svg>
                    <h2>MATH TUTORING by Deni</h2>
                    <p><b>Topic:</b> Number Puzzles & Missing Digits <span class="id-lang">(Teka-teki Angka & Angka yang Hilang)</span></p>
                    <hr style="margin:10px 0">
                    <p><i class="fas fa-video"></i> Class Rules: <span class="id-lang">(Aturan Kelas:)</span></p>
                    <ol>
                        <li>Take turns speaking. <span> <span class="id-lang">(Berbicara secara bergantian.)</span></li>
                        <li>Ask permission if you need to leave. <span class="id-lang">(Meminta izin jika ingin meninggalkan kelas.)</span></li>
                        <li>Turn on camera and mic when needed. <span class="id-lang">(Menyalakan kamera dan mikrofon jika diperlukan.)</span></li>
                    </ol>
                `}
            ]
        });

        // SECTION 1: Spiral Review
        SECTIONS.push({
            title: "Spiral Review (00:00-00:10)",
            type: "section",
            items: [
                { type: "theory", content: `<i class="fas fa-satellite-dish" style="font-size:2rem; color:#1cb0f6"></i><h3>Security Clearance Check</h3><p>Welcome, Agent! To unlock your badge, we must pass the scanner. Let's review place values and basic math! <span class="id-lang">(Selamat datang, Agen! Untuk membuka lencana, kita harus melewati pemindai. Mari ulas nilai tempat dan matematika dasar!)</span></p>` },
                { type: "mc", question: "What number is made of 4 hundreds, 2 tens, and 7 ones? <span class='id-lang'>(Angka apa yang terdiri dari 4 ratusan, 2 puluhan, dan 7 satuan?)</span>", options: ["724", "472", "427", "274"], answer: "427", feedback: "4 hundreds = 400, 2 tens = 20, 7 ones = 7. Total = 427. <span class='id-lang'>(4 ratusan = 400, 2 puluhan = 20, 7 satuan = 7. Total = 427.)</span>" },
                { type: "mc", question: "In the number 835, what is the value of the digit '3'? <span class='id-lang'>(Pada angka 835, berapa nilai digit '3'?)</span>", options: ["3", "30", "300", "35"], answer: "30", feedback: "The '3' is in the tens place, so its value is 3 × 10 = 30. <span class='id-lang'>(Angka '3' berada di tempat puluhan, jadi nilainya 3 × 10 = 30.)</span>" },
                { type: "input", question: "Solve: 12 - 4 = ? <span class=\"id-lang\">(Selesaikan: 12 - 4 = ?)</span>", answer: "8", feedback: "If you have 12 gadgets and lose 4, you have 8 left. <span class=\"id-lang\">(Jika kamu punya 12 gadget dan kehilangan 4, sisanya 8.)</span>" },
                { type: "theory", content: `<i class="fas fa-brain" style="font-size:2rem; color:#e9c46a"></i><h3>Quick Math Logic</h3><p>Small numbers are the foundation of big codes! Let's do one more quick check. <span class='id-lang'>(Angka kecil adalah dasar dari kode besar! Mari kita periksa sekali lagi.)</span></p>` },
                { type: "input", question: "Solve: 15 + 5 = ? <span class='id-lang'>(Selesaikan: 15 + 5 = ?)</span>", answer: "20", feedback: "15 plus 5 makes 20. Clearance granted! <span class='id-lang'>(15 tambah 5 hasilnya 20. Izin diberikan!)</span>" },
                { type: "mc", question: "If I have 18 stars and give away 9, how many are left? <span class='id-lang'>(Jika aku punya 18 bintang dan memberikan 9, berapa sisanya?)</span>", options: ["9", "10", "8", "12"], answer: "9", feedback: "18 - 9 =; 9. <span class='id-lang'>(18 - 9 = 9.)</span>" },
                { type: "input", question: "What is half of 10? <span class='id-lang'>(Berapa setengah dari 10?)</span>", answer: "5", feedback: "10 ÷ 2 = 5. <span class='id-lang'>(10 ÷ 2 = 5.)</span>" },
                { type: "theory", content: `<i class="fas fa-lock-open" style="font-size:2rem; color:var(--primary)"></i><h3>Badge Unlocked!</h3><p>You passed the security check. Now, let's learn how to find missing digits. <span class='id-lang'>(Kamu lulus pemeriksaan keamanan. Sekarang, mari belajar mencari angka yang hilang.)</span></p>` },
                { type: "mc", question: "What digit is missing? $3 + \\boxed{?} = 9$ <span class='id-lang'>(Angka apa yang hilang? $3 + \\boxed{?} = 9$)</span>", options: ["5", "6", "7", "4"], answer: "6", feedback: "Because 3 + 6 = 9. <span class='id-lang'>(Karena 3 + 6 = 9.)</span>" },
                { type: "mc", question: "What digit is missing? $\\boxed{?} + 2 = 8$ <span class=\"id-lang\">(Angka apa yang hilang? $\\boxed{?} + 2 = 8$)</span>", options: ["5", "6", "7", "4"], answer: "6", feedback: "Because 6 + 2 = 8. <span class=\"id-lang\">(Karena 6 + 2 = 8.)</span>" },
                { type: "input", question: "What digit is missing? $10 - \\boxed{?} = 3$ <span class='id-lang'>(Angka apa yang hilang? $10 - \\boxed{?} = 3$)</span>", answer: "7", feedback: "Because 10 - 7 = 3. <span class='id-lang'>(Karena 10 - 7 = 3.)</span>" }
            ]
        });

        // SECTION 2:) Introduction & Real-World Connection
        SECTIONS.push({
            title: "Introduction & Real-World (00:10-00:15)",
            type: "section",
            items: [
                { type: "theory", content: `<svg class="svg-icon" viewBox="0 0 100 100"><path d="M20,80 L50,20 L80,80 Z" fill="#e76f51"/><text x="50" y="70" text-anchor="middle" fill="white" font-size="20">!</text></svg><h3>The 'Ink Spill' Mystery</h3><p>Imagine a spy sent us a secret message, but some of the ink spilled on the numbers! We need to use our math powers to see 'through' the ink. <span class='id-lang'>(Bayangkan seorang mata-mata mengirim pesan rahasia, tetapi tinta menumpah di beberapa angka! Kita perlu menggunakan kekuatan matematika untuk melihat 'melalui' tinta tersebut.)</span></p>` },
                { type: "mc", question: "If an addition equation has ink spilled on one digit, what do we need to find? <span class='id-lang'>(Jika persamaan penjumlahan ada tinta yang menutupi satu digit, apa yang perlu kita cari?)</span>", options: ["The whole equation", "The missing digit", "A new pen"], answer: "The missing digit", feedback: "We must find the missing digit to complete the truth! <span class='id-lang'>(Kita harus menemukan angka yang hilang untuk melengkapi kebenarannya!)</span>" },
                { type: "mc", question: "Which part of a whole is missing if we have 10, and the whole is 15? <span class='id-lang'>(Bagian mana dari keseluruhan yang hilang jika kita punya 10, dan keseluruhannya 15?)</span>", options: ["10", "25", "5"], answer: "5", feedback: "10 + 5 = 15. The missing part is 5. <span class='id-lang'>(10 + 5 = 15. Bagian yang hilang adalah 5.)</span>" },
                { type: "input", question: "If $8 + \\boxed{?} = 12$, what is the missing part? <span class='id-lang'>(Jika $8 + \\boxed{?} = 12$, berapa bagian yang hilang?)</span>", answer: "4", feedback: "12 - 8 = 4. <span class='id-lang'>(12 - 8 = 4.)</span>" },
                { type: "theory", content: `<i class="fas fa-search" style="font-size:2rem; color:#1cb0f6"></i><h3>Finding Invisible Digits</h3><p>Being able to find missing numbers helps us solve mysteries and fix mistakes in real life. Are you ready to find the invisible digits? <span class='id-lang'>(Kemampuan menemukan angka yang hilang membantu kita memecahkan misteri dan memperbaiki kesalahan di dunia nyata. Apakah kamu siap menemukan angka yang tidak terlihat?)</span></p>` },
                { type: "mc", question: "If $\\boxed{?} + 5 = 15$, how do we find the missing number? <span class='id-lang'>(Jika $\\boxed{?} + 5 = 15$, bagaimana cara menemukan angka yang hilang?)</span>", options: ["15 + 5", "15 - 5", "5 - 15"], answer: "15 - 5", feedback: "To find a missing part, subtract the known part from the whole. <span class='id-lang'>(Untuk menemukan bagian yang hilang, kurangi bagian yang diketahui dari keseluruhan.)</span>" },
                { type: "input", question: "Find the missing digit: $20 - \\boxed{?} = 12$ <span class='id-lang'>(Temukan angka yang hilang: $20 - \\boxed{?} = 12$)</span>", answer: "8", feedback: "20 - 12 = 8. <span class='id-lang'>(20 - 12 = 8.)</span>" },
                { type: "mc", question: "A recipe needs 10 eggs. You only have 6. How many are 'missing'? <span class='id-lang'>(Resep butuh 10 telur. Kamu hanya punya 6. Berapa yang 'hilang'?)</span>", options: ["16", "4", "5"], answer: "4", feedback: "10 - 6 = 4 missing eggs. <span class='id-lang'>(10 - 6 = 4 telur hilang.)</span>" },
                { type: "theory", content: `<i class="fas fa-puzzle-piece" style="font-size:2rem; color:#e9c46a"></i><h3>Puzzles are Just Missing Parts!</h3><p>Every number puzzle is just a question asking, "What is missing?" <span class='id-lang'>(Setiap teka-teki angka hanyalah pertanyaan, "Apa yang hilang?")</span></p>` },
